name: evaluacion-josue-lopez

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: transferencias
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_JDBC_URL: jdbc:mysql://db:3306/transferencias?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DB_USERNAME: app
      DB_PASSWORD: app
      APP_SEED_ENABLED: "true"
      APP_BUSINESS_ZONE: America/Bogota
      TZ: America/Bogota
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  tests:
    image: maven:3.9.9-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /src
    volumes:
      - ./backend:/src
      - maven_cache:/root/.m2
    command: mvn -B test

volumes:
  db_data:
  maven_cache:
