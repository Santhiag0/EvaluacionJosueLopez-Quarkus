quarkus.application.name=EvaluacionJosueSantiagoLopez
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:transferencias}
quarkus.datasource.password=${DB_PASSWORD:transferencias}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:mysql://localhost:3317/transferencias?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.jackson.write-dates-as-timestamps=false

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.access-control-max-age=24H

quarkus.smallrye-openapi.info-title=Sistema de Gestión de Transferencias Interbancarias
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de EvaluacionJosueSantiagoLopez. Administra cuentas, ejecuta transferencias atómicas, detecta operaciones que requieren revisión y controla el límite diario de $10,000.00.
quarkus.smallrye-openapi.info-contact-name=Josue Santiago Lopez
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

mp.openapi.scan.disable=false

app.seed.enabled=true
app.zona-horaria=America/Guayaquil

quarkus.log.level=INFO
quarkus.log.category."com.evaluacion".level=INFO

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:transferencias;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.app.seed.enabled=false
%test.quarkus.log.level=WARN
%test.quarkus.log.category."com.evaluacion".level=INFO
