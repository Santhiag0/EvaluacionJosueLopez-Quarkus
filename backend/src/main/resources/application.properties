quarkus.application.name=evaluacion-josue-lopez
quarkus.http.port=8080

# El navegador del frontend en desarrollo (ng serve) llama al API en otro puerto.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8088,http://localhost:4200,http://localhost,http://127.0.0.1:8088,http://127.0.0.1:4200
quarkus.http.cors.methods=GET,POST,OPTIONS,HEAD
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin
quarkus.http.cors.access-control-max-age=24H

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME:app}
quarkus.datasource.password=${DB_PASSWORD:app}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:mysql://localhost:3306/transferencias?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=Sistema de Gestión de Transferencias Interbancarias
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de cuentas y transferencias con validación de saldo, límite diario y detección de operaciones sospechosas. Evaluación técnica de Josué López.

app.business.zone=America/Bogota
app.seed.enabled=false

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:transferencias;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.app.seed.enabled=false
